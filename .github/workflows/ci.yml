name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.1 (as on the controller)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.1
      - run: lua5.1 test.lua
